<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retention-Ready Workplace™ Portal | Jan's Dreams</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --secondary: #0d9488;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      width: 100%;
      max-width: 600px;
      padding: 30px;
      box-sizing: border-box;
    }
    .header {
      text-align: center;
      margin-bottom: 25px;
    }
    .header img {
      max-height: 60px;
      margin-bottom: 10px;
    }
    .header h1 {
      font-size: 1.25rem;
      color: var(--primary);
      margin: 0 0 5px 0;
    }
    .header p {
      font-size: 0.85rem;
      color: #64748b;
      margin: 0;
    }
    .section-box {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      background: #ffffff;
    }
    .section-title {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: block;
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }
    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      text-align: center;
    }
    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="container" id="mainContainer">
    <div class="header">
      <img src="Logo Designed.png" alt="Jan's Dreams Logo" onerror="this.style.display='none'">
      <h1>Retention-Ready Workplace™ Portal</h1>
      <p>Jan's Dreams Administration & System Gateway</p>
    </div>

    <div class="section-box">
      <span class="section-title">Employer & Organization Authentication</span>
      <label>Enter Assigned Access Code:</label>
      <input type="text" id="accessCode" value="NMDWS-SANTAFE-01">
      <button class="btn" onclick="openDashboard()">Enter Portal</button>
    </div>
  </div>

  <script>
    function openDashboard() {
      const codeInput = document.getElementById('accessCode').value.trim() || "NMDWS - Santa Fe Hub";
      const container = document.getElementById('mainContainer');
      
      container.innerHTML = `
        <div class="header">
          <img src="Logo Designed.png" alt="Jan's Dreams Logo" onerror="this.style.display='none'">
          <h1>Retention-Ready Ecosystem™ Dashboard</h1>
          <p>Active Organization: <strong>${codeInput}</strong></p>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px;">
          <div style="background: #f8fafc; border: 1px solid var(--border); padding: 15px; border-radius: 8px; text-align: center;">
            <span style="font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase;">Active Incidents Logged</span>
            <div style="font-size: 1.4rem; font-weight: 700; color: var(--primary); margin-top: 5px;">1 Ledger Entry</div>
          </div>
          <div style="background: #f8fafc; border: 1px solid var(--border); padding: 15px; border-radius: 8px; text-align: center;">
            <span style="font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase;">Compliance Status</span>
            <div style="font-size: 1.1rem; font-weight: 700; color: #16a34a; margin-top: 5px;">Verified (DOL RRW)</div>
          </div>
        </div>

        <div class="section-box">
          <span class="section-title">Recent Incident Compliance Ledger</span>
          <table style="width: 100%; font-size: 0.8rem; border-collapse: collapse; margin-top: 10px;">
            <thead>
              <tr style="background: #f1f5f9; text-align: left;">
                <th style="padding: 8px; border: 1px solid var(--border);">Incident ID</th>
                <th style="padding: 8px; border: 1px solid var(--border);">Indicator</th>
                <th style="padding: 8px; border: 1px solid var(--border);">Action Protocol</th>
                <th style="padding: 8px; border: 1px solid var(--border);">Status</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td style="padding: 8px; border: 1px solid var(--border);">inc-dws-012026</td>
                <td style="padding: 8px; border: 1px solid var(--border);">Attendance / Punctuality</td>
                <td style="padding: 8px; border: 1px solid var(--border);">Informal Compliance Discussion</td>
                <td style="padding: 8px; border: 1px solid var(--border); color: #16a34a; font-weight: 600;">Reasonable Acc.</td>
              </tr>
            </tbody>
          </table>
        </div>

        <button class="btn" style="background-color: #64748b; margin-top: 10px;" onclick="location.reload()">Log Out / Reset Portal</button>
      `;
    }
  </script>

</body>
</html>
